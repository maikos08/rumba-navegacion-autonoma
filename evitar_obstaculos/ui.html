<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evitar obstáculos Create 2</title>
<link rel="stylesheet" href="/static/base.css">
</head>
<body>
<header>
  <div id="coords">x = 0.000 m · y = 0.000 m · θ = 0.0°</div>
  <div>Modo: <span id="modo"></span> · Estado: <span id="estado">Sin objetivo</span> · Choques: <span id="choques">0</span></div>
  <form id="form">
    x <input id="ox" type="number" step="0.1" value="1">
    y <input id="oy" type="number" step="0.1" value="0">
    m <button class="prim" type="submit">Ir</button>
  </form>
  <button id="parar">Parar</button>
  <button id="salir">Salir</button>
  <div id="ir" class="mono">IR: -</div>
  <div class="leyenda">
    <span><i style="background:#9ca3af"></i>línea M</span>
    <span><i style="background:#ea580c"></i>encuentro H</span>
    <span><i style="background:#7c3aed"></i>salida</span>
    <span><i style="background:#111"></i>choque</span>
  </div>
  <span id="conexion"></span>
</header>
<canvas id="mapa" class="clicable"></canvas>
<script src="/static/mapa.js"></script>
<script>
const mapa = new Mapa($('mapa'));
let camino = [];
let datos = { x: 0, y: 0, theta: 0, objetivo: null, inicio: null, estado: 'Sin objetivo',
              obstaculos: [], encuentros: [], salidas: [], ir: [0,0,0,0,0,0], choques: 0 };

function irA(xm, ym) {   // coordenadas en metros
  xm = r2(xm); ym = r2(ym);
  $('ox').value = xm;
  $('oy').value = ym;
  post(`/objetivo?x=${xm}&y=${ym}`);
}
$('form').onsubmit = e => { e.preventDefault(); irA(+$('ox').value, +$('oy').value); };
$('parar').onclick = () => post('/cmd?c=p');
$('salir').onclick = () => post('/cmd?c=q');
$('mapa').addEventListener('click', e => {
  const p = mapa.clicAMetros(e);
  if (p) irA(p[0], p[1]);
});

function dibujar() {
  const pts = camino.concat([[datos.x, datos.y]], datos.obstaculos);
  if (datos.objetivo) pts.push(datos.objetivo);
  mapa.preparar(pts);

  // Línea M y objetivo
  if (datos.objetivo) {
    if (datos.inicio) mapa.linea([datos.inicio, datos.objetivo], { color: '#9ca3af', guiones: [6, 5] });
    mapa.aspa(datos.objetivo);
  }
  mapa.camino(camino, datos);
  for (const p of datos.obstaculos) mapa.punto(p, '#111', 4);
  for (const p of datos.encuentros) mapa.punto(p, '#ea580c', 6);
  for (const p of datos.salidas) mapa.punto(p, '#7c3aed', 6);
  mapa.punto([0, 0], '#16a34a', 5);
  mapa.robot(datos);
}

iniciarSondeo({
  alRecibir(d, c) {
    camino = c; datos = d;
    $('coords').textContent =
      `x = ${(d.x / 1000).toFixed(3)} m · y = ${(d.y / 1000).toFixed(3)} m · θ = ${gradosDe(d.theta).toFixed(1)}°`;
    $('estado').textContent = d.estado;
    $('choques').textContent = d.choques;
    $('modo').textContent = d.modo;
    $('ir').textContent = 'IR (izq→der): ' + d.ir.join(' ');
    $('conexion').textContent = '';
    dibujar();
  },
  alFallar() { $('conexion').textContent = 'Sin conexión con el programa'; dibujar(); },
});
addEventListener('resize', dibujar);
</script>
</body>
</html>
